name: Build JoEnglish APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construire l'APK
        run: gradle assembleDebug

      - name: Vérifier l'APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: JoEnglish-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Créer une Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: joenglish-build-${{ github.run_number }}
          name: JoEnglish APK Build ${{ github.run_number }}
          body: APK JoEnglish généré automatiquement.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
